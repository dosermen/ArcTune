# Pre-commit хуки ArcTune.
# Локальные system-хуки: работают с уже установленными ruff/mypy, без сети
# и без пиннинга версий в этом файле (версии — pyproject.toml [project.optional-dependencies] dev).
# Установка: pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-check
        name: ruff check --fix
        entry: ruff check --fix
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy src/arctuner
        entry: python -m mypy src/arctuner
        language: system
        types: [python]
        pass_filenames: false
