name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Клони репозиторий
        uses: actions/checkout@v4

      - name: Установить Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install PySide6>=6.5

      - name: Линтинг — ruff format
        run: ruff format .

      - name: Линтинг — ruff check
        run: ruff check --fix .

      - name: Тесты — pytest (без железа)
        run: python -m pytest -q --ignore=tests/test_hardware.py

      - name: Тесты — pytest (железо)
        if: github.ref == 'refs/heads/main'
        run: python -m pytest -q tests/test_hardware.py
        continue-on-error: true

      - name: Сборка GUI — pyinstaller
        run: |
          pip install -e ".[build]"
          pyinstaller --clean --noconfirm packaging/arctune-gui.spec

      - name: Smoke-чек собранных файлов
        run: |
          Test-Path "dist/arctune-gui.exe"
          if ($LASTEXITCODE -eq 1) { exit 1 }
