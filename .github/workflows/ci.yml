name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Клони репозиторий
        uses: actions/checkout@v4

      - name: Установить Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Установить зависимости
        # Кавычки обязательны: без них PowerShell трактует `>` как редирект
        # и pip установил бы PySide6 без ограничения версии.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"

      - name: Линтинг — ruff format (без правок: CI только проверяет)
        run: ruff format --check .

      - name: Линтинг — ruff check (без --fix: CI только проверяет)
        run: ruff check .

      - name: Тесты — pytest (без железа)
        run: python -m pytest -m "not hardware" -q

      - name: Сборка GUI — pyinstaller
        run: |
          pip install -e ".[build]"
          pyinstaller --clean --noconfirm packaging/arctune-gui.spec

      - name: Smoke-чек собранных файлов
        # Test-Path печатает True/False, но не выставляет $LASTEXITCODE —
        # поэтому проверяем результат выражением, иначе потеря exe CI не заметит.
        run: |
          if (-not (Test-Path "dist/arctune-gui.exe")) {
            Write-Host "dist/arctune-gui.exe не собран"
            exit 1
          }
