[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arctune"
version = "0.1.0"
description = "Python-обёртка над IGCL API для мониторинга и разгона Intel Arc (B580)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ArcTune contributors" }]
keywords = ["intel", "arc", "b580", "igcl", "overclock", "telemetry", "gpu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

# Зависимости рантайма. ctypes входит в stdlib, поэтому ядро без зависимостей.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]
build = [
    "pyinstaller>=6.0",
]
gui = [
    "PySide6>=6.5",
]

[project.scripts]
arctune = "arctuner.cli:main"
arctune-gui = "arctuner.gui.main:run"

[project.urls]
Repository = "https://github.com/your-user/arctune"
Documentation = "https://github.com/your-user/arctune/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001/2/3 — «ambiguous unicode»: проект русскоязычный, кириллица намеренная.
# N812 — алиас `types as T` выбран осознанно (C-подобная читаемость низкого слоя).
ignore = ["E501", "RUF001", "RUF002", "RUF003", "N812"]

[tool.ruff.lint.isort]
known-first-party = ["arctuner"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
warn_no_return = false
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_untyped_calls = false
strict_equality = true
no_implicit_optional = true
scripts_can_be_main = true
disallow_any_generics = false

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: тесты, требующие реального устройства Intel Arc",
]
addopts = "-q"